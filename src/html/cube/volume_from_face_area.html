<!DOCTYPE html>
<html lang='en'>
<head>
<title> Cube: Volume from Face Area </title>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<link rel="stylesheet" href="../../../src/css/style001.css">

<script src='../../../src/js/1shortcuts/shortcuts.js'></script>
<script src='../../../src/js/sound/sound.js'></script>

<script>

function calculateCubeVolumeFromFaceArea(faceArea)
{
    try
    {
        // Volume = Face Area * sqrt(Face Area)
        // Or simply: Face Area ^ 1.5
        let fa = parseFloat(faceArea);
        let volume = Math.pow(fa, 1.5);
        
        return volume.toFixed(3);
    }
    catch (error)
    {
        console.log("Error: Could not convert input to a number.");
        return null;
    }
}

function makeInterface()
{
    let theTitle = ce('div');
    theTitle.id = 'theTitle';
    theTitle.textContent = 'Cube: Volume from Face Area';
    ba(theTitle);

    let mainWrapper = ce('div');
    mainWrapper.style.display = 'flex';
    mainWrapper.style.flexDirection = 'row';
    mainWrapper.style.gap = '40px';
    mainWrapper.style.alignItems = 'center';
    ba(mainWrapper);

    // ===
    // LEFT SIDE: The Calculator
    // ===
    let inputContainer = ce('div');
    inputContainer.id = 'inputContainer';
    mainWrapper.append(inputContainer);

    let input_A_Label = ce('div');
    input_A_Label.id = 'input_A_Label';
    input_A_Label.textContent = 'FACE AREA';
    inputContainer.append(input_A_Label);

    let inputA = ce('input');
    inputA.id = 'inputA';
    inputA.type = 'number';
    inputA.oninput = function()
    {
        inputSound();

        let result = calculateCubeVolumeFromFaceArea(inputA.value);
        ge('result').value = result;
        
        if (inputA.value === '')
        {
            ge('svgFaceText').textContent = 'Face Area';
            ge('svgVolumeText').textContent = 'Volume';
        }
        else
        {
            ge('svgFaceText').textContent = 'FA = ' + inputA.value;
            ge('svgVolumeText').textContent = 'V = ' + result; 
        }
    };
    inputContainer.append(inputA);

    //-//

    let result_label = ce('div');
    result_label.id = 'result_label';
    result_label.textContent = 'Volume';
    inputContainer.append(result_label);

    let result = ce('textarea');
    result.id = 'result';
    result.readOnly = true; 
    inputContainer.append(result);

    // ===
    // RIGHT SIDE: The SVG Graphic
    // ===
    let visualContainer = ce('div');
    visualContainer.id = 'visualContainer';
    
    visualContainer.innerHTML = `
        <svg width="300" height="250" viewBox="0 0 300 250">
            <!-- TOP FACE (Output: Volume) -->
            <!-- Solid glowing yellow fill -->
            <polygon points="90,100 130,60 230,60 190,100" fill="rgba(255, 204, 0, 0.4)" stroke="#ffcc00" stroke-width="1.5" stroke-linejoin="round" />
            
            <!-- RIGHT FACE (Output: Volume) -->
            <!-- Solid glowing yellow fill -->
            <polygon points="190,100 230,60 230,160 190,200" fill="rgba(255, 204, 0, 0.3)" stroke="#ffcc00" stroke-width="1.5" stroke-linejoin="round" />
            
            <!-- FRONT FACE (Output: Volume AND Input: Face Area) -->
            <!-- We fill it with yellow to represent the 3D volume behind it, 
                 but we border it with thick dashed cyan to show it is the 2D input node -->
            <polygon points="90,100 190,100 190,200 90,200" fill="rgba(255, 204, 0, 0.5)" stroke="#00ffcc" stroke-width="4" stroke-dasharray="8,6" stroke-linejoin="round" />

            <!-- VOLUME LABEL (Outputs the Result, resting inside the 3D mass) -->
            <text id="svgVolumeText" x="160" y="140" fill="#ffcc00" font-size="22" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Volume</text>

            <!-- FACE AREA LABEL (Inputs the Value, resting at the bottom of the dashed cyan square) -->
            <text id="svgFaceText" x="140" y="190" fill="#00ffcc" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Face Area</text>
        </svg>
    `;
    mainWrapper.append(visualContainer);
}

function whenLoaded()
{
    makeInterface();
}

</script>
</head>
<body onload='whenLoaded();'>
</body>
</html>
