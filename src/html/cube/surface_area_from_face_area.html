<!DOCTYPE html>
<html lang='en'>
<head>
<title> Cube: Surface Area from Face Area </title>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<link rel="stylesheet" href="../../../src/css/style001.css">

<script src='../../../src/js/1shortcuts/shortcuts.js'></script>
<script src='../../../src/js/sound/sound.js'></script>

<script>

function calculateCubeSurfaceAreaFromFaceArea(faceArea)
{
    try
    {
        // Total Surface Area = Face Area * 6
        // (Because a cube has exactly 6 identical faces)
        let fa = parseFloat(faceArea);
        let surfaceArea = fa * 6;
        
        return surfaceArea.toFixed(3);
    }
    catch (error)
    {
        console.log("Error: Could not convert input to a number.");
        return null;
    }
}

function makeInterface()
{
    let theTitle = ce('div');
    theTitle.id = 'theTitle';
    theTitle.textContent = 'Cube: Surface Area from Face Area';
    ba(theTitle);

    let mainWrapper = ce('div');
    mainWrapper.style.display = 'flex';
    mainWrapper.style.flexDirection = 'row';
    mainWrapper.style.gap = '40px';
    mainWrapper.style.alignItems = 'center';
    ba(mainWrapper);

    // ===
    // LEFT SIDE: The Calculator
    // ===
    let inputContainer = ce('div');
    inputContainer.id = 'inputContainer';
    mainWrapper.append(inputContainer);

    let input_A_Label = ce('div');
    input_A_Label.id = 'input_A_Label';
    input_A_Label.textContent = 'FACE AREA';
    inputContainer.append(input_A_Label);

    let inputA = ce('input');
    inputA.id = 'inputA';
    inputA.type = 'number';
    inputA.oninput = function()
    {
        inputSound();
        
        let result = calculateCubeSurfaceAreaFromFaceArea(inputA.value);
        ge('result').value = result;
        
        if (inputA.value === '')
        {
            ge('svgFaceText').textContent = 'Face Area';
            ge('svgSurfaceText').textContent = 'Surface Area';
        }
        else
        {
            ge('svgFaceText').textContent = 'FA = ' + inputA.value;
            ge('svgSurfaceText').textContent = 'SA = ' + result; 
        }
    };
    inputContainer.append(inputA);

    //-//

    let result_label = ce('div');
    result_label.id = 'result_label';
    result_label.textContent = 'Surface Area';
    inputContainer.append(result_label);

    let result = ce('textarea');
    result.id = 'result';
    result.readOnly = true; 
    inputContainer.append(result);

    // ===
    // RIGHT SIDE: The SVG Graphic
    // ===
    let visualContainer = ce('div');
    visualContainer.id = 'visualContainer';
    
    visualContainer.innerHTML = `
        <svg width="300" height="250" viewBox="0 0 300 250">
            <!-- TOP FACE (Output: Part of total Surface Area) -->
            <polygon points="90,100 130,60 230,60 190,100" fill="rgba(255, 204, 0, 0.7)" stroke="#ffcc00" stroke-width="1.5" stroke-linejoin="round" />
            
            <!-- RIGHT FACE (Output: Part of total Surface Area) -->
            <polygon points="190,100 230,60 230,160 190,200" fill="rgba(255, 204, 0, 0.5)" stroke="#ffcc00" stroke-width="1.5" stroke-linejoin="round" />
            
            <!-- FRONT FACE (Output: Part of total Surface Area) -->
            <!-- Also acts as the specific Input: Face Area -->
            <!-- Drawn with a dashed cyan border over the yellow fill to show it is the starting node -->
            <polygon points="90,100 190,100 190,200 90,200" fill="rgba(255, 204, 0, 0.9)" stroke="#00ffcc" stroke-width="4" stroke-dasharray="8,6" stroke-linejoin="round" />

            <!-- FACE AREA LABEL (Inputs the Value, resting center of the dashed square) -->
            <text id="svgFaceText" x="140" y="155" fill="#00ffcc" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Face Area</text>

            <!-- SURFACE AREA LABEL (Outputs the Result, resting across the top faces) -->
            <text id="svgSurfaceText" x="180" y="85" fill="#ffcc00" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Surface Area</text>
        </svg>
    `;
    mainWrapper.append(visualContainer);
}

function whenLoaded()
{
    makeInterface();
}

</script>
</head>
<body onload='whenLoaded();'>
</body>
</html>
