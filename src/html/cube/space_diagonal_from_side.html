<!DOCTYPE html>
<html lang='en'>
<head>
<title> Cube: Space Diagonal from Side </title>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<link rel="stylesheet" href="../../../src/css/style001.css">

<script src='../../../src/js/1shortcuts/shortcuts.js'></script>
<script src='../../../src/js/sound/sound.js'></script>

<script>

function calculateCubeSpaceDiagonalFromSide(side)
{
    try
    {
        // Space Diagonal = side * sqrt(3)
        let s = parseFloat(side);
        let spaceDiagonal = s * Math.sqrt(3);
        
        return spaceDiagonal.toFixed(3);
    }
    catch (error)
    {
        console.log("Error: Could not convert input to a number.");
        return null;
    }
}

function makeInterface()
{
    let theTitle = ce('div');
    theTitle.id = 'theTitle';
    theTitle.textContent = 'Cube: Space Diagonal from Side';
    ba(theTitle);

    let mainWrapper = ce('div');
    mainWrapper.style.display = 'flex';
    mainWrapper.style.flexDirection = 'row';
    mainWrapper.style.gap = '40px';
    mainWrapper.style.alignItems = 'center';
    ba(mainWrapper);

    // ===
    // LEFT SIDE: The Calculator
    // ===
    let inputContainer = ce('div');
    inputContainer.id = 'inputContainer';
    mainWrapper.append(inputContainer);

    let input_A_Label = ce('div');
    input_A_Label.id = 'input_A_Label';
    input_A_Label.textContent = 'SIDE';
    inputContainer.append(input_A_Label);

    let inputA = ce('input');
    inputA.id = 'inputA';
    inputA.type = 'number';
    inputA.oninput = function()
    {
        if(typeof inputSound === "function") inputSound();
        
        let result = calculateCubeSpaceDiagonalFromSide(inputA.value);
        ge('result').value = result;
        
        // Update both SVG labels dynamically
        if (inputA.value === '')
        {
            ge('svgSideText').textContent = 'Side';
            ge('svgDiagonalText').textContent = 'Space Diagonal';
        }
        else
        {
            ge('svgSideText').textContent = 'S = ' + inputA.value;
            ge('svgDiagonalText').textContent = 'SD = ' + result; 
        }
    };
    inputContainer.append(inputA);

    //-//

    let result_label = ce('div');
    result_label.id = 'result_label';
    result_label.textContent = 'Space Diagonal';
    inputContainer.append(result_label);

    let result = ce('textarea');
    result.id = 'result';
    result.readOnly = true; 
    inputContainer.append(result);

    // ===
    // RIGHT SIDE: The SVG Graphic
    // ===
    let visualContainer = ce('div');
    visualContainer.id = 'visualContainer';
    
    // We draw the cube manually using SVG polygons and lines.
    // Faces are highly transparent so the internal diagonal line pops out.
    visualContainer.innerHTML = `
        <svg width="300" height="250" viewBox="0 0 300 250">
            <!-- BACK, BOTTOM, AND HIDDEN EDGES (Dashed to show 3D depth) -->
            <polygon points="130,60 230,60 230,160 130,160" fill="rgba(0, 255, 255, 0.05)" stroke="#00ffcc" stroke-width="1" stroke-dasharray="2,4" />
            <line x1="90" y1="200" x2="130" y2="160" stroke="#00ffcc" stroke-width="1" stroke-dasharray="2,4" />

            <!-- TOP FACE (Wireframe with slight tint) -->
            <polygon points="90,100 130,60 230,60 190,100" fill="rgba(0, 255, 255, 0.1)" stroke="#00ffcc" stroke-width="1.5" stroke-linejoin="round" />
            
            <!-- RIGHT FACE (Wireframe with slight tint) -->
            <polygon points="190,100 230,60 230,160 190,200" fill="rgba(0, 255, 255, 0.1)" stroke="#00ffcc" stroke-width="1.5" stroke-linejoin="round" />
            
            <!-- FRONT FACE (Wireframe with slight tint) -->
            <polygon points="90,100 190,100 190,200 90,200" fill="rgba(0, 255, 255, 0.1)" stroke="#00ffcc" stroke-width="1.5" stroke-linejoin="round" />

            <!-- SIDE LINE (Input: The bottom-front edge) -->
            <!-- Drawn thick to show it is the starting property -->
            <line x1="90" y1="200" x2="190" y2="200" stroke="#00ffcc" stroke-width="4" stroke-linecap="round" />
            
            <!-- SPACE DIAGONAL (Output: From bottom-left-front to top-right-back) -->
            <!-- Drawn very thick to pop out from inside the wireframe -->
            <line x1="90" y1="200" x2="230" y2="60" stroke="#ffcc00" stroke-width="5" stroke-linecap="round" />

            <!-- SIDE LABEL (Inputs the Value, resting below the bottom edge) -->
            <text id="svgSideText" x="140" y="225" fill="#00ffcc" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Side</text>

            <!-- SPACE DIAGONAL LABEL (Outputs the Result, resting diagonally near the center) -->
            <text id="svgDiagonalText" x="120" y="110" fill="#ffcc00" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" transform="rotate(-35, 120, 110)" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Space Diagonal</text>
        </svg>
    `;
    mainWrapper.append(visualContainer);
}

function whenLoaded()
{
    makeInterface();
}

</script>
</head>
<body onload='whenLoaded();'>
</body>
</html>
