<!DOCTYPE html>
<html lang='en'>
<head>
<title> Circumference from Radius </title>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<link rel="stylesheet" href="../../../src/css/style001.css">

<script src='../../../src/js/1shortcuts/shortcuts.js'></script>
<script src='../../../src/js/sound/sound.js'></script>

<script>

function calculateCircumferenceFromRadius(radius)
{
    try
    {
        let circumference = 2 * Math.PI * parseFloat(radius);
        
        return circumference.toFixed(3);
    }
    catch (error)
    {
        console.log("Error: Could not convert input to a number.");
        return null;
    }
}

function makeInterface()
{
    let theTitle = ce('div');
    theTitle.id = 'theTitle';
    theTitle.textContent = 'Circumference from Radius';
    ba(theTitle);

    let mainWrapper = ce('div');
    mainWrapper.style.display = 'flex';
    mainWrapper.style.flexDirection = 'row';
    mainWrapper.style.gap = '40px';
    mainWrapper.style.alignItems = 'center';
    ba(mainWrapper);

    // ===
    // LEFT SIDE: The Calculator
    // ===
    let inputContainer = ce('div');
    inputContainer.id = 'inputContainer';
    mainWrapper.append(inputContainer);

    let input_A_Label = ce('div');
    input_A_Label.id = 'input_A_Label';
    input_A_Label.textContent = 'RADIUS';
    inputContainer.append(input_A_Label);

    let inputA = ce('input');
    inputA.id = 'inputA';
    inputA.type = 'number';
    inputA.oninput = function()
    {
        if(typeof inputSound === "function") inputSound();
        
        let result = calculateCircumferenceFromRadius(inputA.value);
        ge('result').value = result;
        
        // Update both SVG labels dynamically
        if (inputA.value === '')
        {
            ge('svgRadiusText').textContent = 'Radius';
            ge('svgCircumferenceText').textContent = 'Circumference';
        }
        else
        {
            ge('svgRadiusText').textContent = inputA.value;
            ge('svgCircumferenceText').textContent = 'C = ' + result;
        }
    };
    inputContainer.append(inputA);

    //-//

    let result_label = ce('div');
    result_label.id = 'result_label';
    result_label.textContent = 'Circumference';
    inputContainer.append(result_label);

    let result = ce('textarea');
    result.id = 'result';
    result.readOnly = true; 
    inputContainer.append(result);

    // ===
    // RIGHT SIDE: The SVG Graphic
    // ===
    let visualContainer = ce('div');
    visualContainer.id = 'visualContainer';
    
    visualContainer.innerHTML = `
        <svg width="300" height="250" viewBox="0 0 300 250">
            <defs>
                <!-- An invisible curved path for the Circumference text to follow -->
                <path id="circleCurve" d="M 50,125 A 100,100 0 0,1 250,125" fill="none" />
            </defs>

            <!-- The Circle Shape -->
            <!-- Thick stroke emphasizes that circumference is the outside edge -->
            <circle cx="150" cy="125" r="100" fill="rgba(0, 136, 255, 0.05)" stroke="#00ffcc" stroke-width="6" />
            
            <!-- Center Dot -->
            <circle cx="150" cy="125" r="4" fill="#ffcc00" />
            
            <!-- Dashed Radius Line -->
            <line x1="150" y1="125" x2="250" y2="125" stroke="#ffcc00" stroke-width="2" stroke-dasharray="5,5" />
            
            <!-- Radius Label (Inputs the Value) -->
            <text id="svgRadiusText" x="200" y="115" fill="#ffcc00" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">Radius</text>
            
            <!-- Circumference Label (Outputs the Result, curving along the top border) -->
            <text fill="#00ffcc" font-size="20" font-weight="bold" font-family="Arial, sans-serif" dy="-10">
                <textPath id="svgCircumferenceText" href="#circleCurve" startOffset="50%" text-anchor="middle">Circumference</textPath>
            </text>
        </svg>
    `;
    mainWrapper.append(visualContainer);
}

function whenLoaded()
{
    makeInterface();
}

</script>

</head>

<body onload='whenLoaded();'>

</body>

</html>
