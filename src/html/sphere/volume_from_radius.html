<!DOCTYPE html>
<html lang='en'>
<head>
<title> Sphere: Volume from Radius </title>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<link rel="stylesheet" href="../../../src/css/style001.css">

<script src='../../../src/js/1shortcuts/shortcuts.js'></script>
<script src='../../../src/js/sound/sound.js'></script>

<script>

function calculateSphereVolumeFromRadius(radius)
{
    try
    {
        // Volume = (4/3) * pi * r^3
        let r = parseFloat(radius);
        let volume = (4/3) * Math.PI * (r * r * r);
        
        return volume.toFixed(3);
    }
    catch (error)
    {
        console.log("Error: Could not convert input to a number.");
        return null;
    }
}

function makeInterface()
{
    let theTitle = ce('div');
    theTitle.id = 'theTitle';
    theTitle.textContent = 'Sphere: Volume from Radius';
    ba(theTitle);

    let mainWrapper = ce('div');
    mainWrapper.style.display = 'flex';
    mainWrapper.style.flexDirection = 'row';
    mainWrapper.style.gap = '40px';
    mainWrapper.style.alignItems = 'center';
    ba(mainWrapper);

    // ===
    // LEFT SIDE: The Calculator
    // ===
    let inputContainer = ce('div');
    inputContainer.id = 'inputContainer';
    mainWrapper.append(inputContainer);

    let input_A_Label = ce('div');
    input_A_Label.id = 'input_A_Label';
    input_A_Label.textContent = 'RADIUS';
    inputContainer.append(input_A_Label);

    let inputA = ce('input');
    inputA.id = 'inputA';
    inputA.type = 'number';
    inputA.oninput = function()
    {
        if(typeof inputSound === "function") inputSound();
        
        let result = calculateSphereVolumeFromRadius(inputA.value);
        ge('result').value = result;
        
        // Update both SVG labels dynamically
        if (inputA.value === '')
        {
            ge('svgRadiusText').textContent = 'Radius';
            ge('svgVolumeText').textContent = 'Volume';
        }
        else
        {
            ge('svgRadiusText').textContent = 'R = ' + inputA.value;
            ge('svgVolumeText').textContent = 'V = ' + result; 
        }
    };
    inputContainer.append(inputA);

    //-//

    let result_label = ce('div');
    result_label.id = 'result_label';
    result_label.textContent = 'Volume';
    inputContainer.append(result_label);

    let result = ce('textarea');
    result.id = 'result';
    result.readOnly = true; 
    inputContainer.append(result);

    // ===
    // RIGHT SIDE: The SVG Graphic
    // ===
    let visualContainer = ce('div');
    visualContainer.id = 'visualContainer';
    
    visualContainer.innerHTML = `
        <svg width="300" height="250" viewBox="0 0 300 250">
            <defs>
                <!-- 3D Radial Gradient Lighting -->
                <!-- Glowing yellow/orange represents the solid "filled" Volume inside -->
                <radialGradient id="sphereLight" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="rgba(255, 255, 0, 0.8)" />
                    <stop offset="100%" stop-color="rgba(255, 136, 0, 0.4)" />
                </radialGradient>
            </defs>

            <!-- The Sphere Base (Output: Volume) -->
            <circle cx="150" cy="125" r="100" fill="url(#sphereLight)" stroke="#ffcc00" stroke-width="2" />
            
            <!-- A subtle dotted equator just to keep the 3D depth illusion intact -->
            <path d="M 50,125 A 100,30 0 0,0 250,125" fill="none" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.6" />
            <path d="M 50,125 A 100,30 0 0,1 250,125" fill="none" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.3" />

            <!-- Dashed Radius Line (Input: Spanning from the core to the edge) -->
            <line x1="150" y1="125" x2="250" y2="125" stroke="#00ffcc" stroke-width="3" stroke-dasharray="5,5" />

            <!-- Center Core Dot -->
            <circle cx="150" cy="125" r="5" fill="#00ffcc" />
            
            <!-- Radius Label (Inputs the Value, resting slightly above the line) -->
            <text id="svgRadiusText" x="200" y="115" fill="#00ffcc" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Radius</text>

            <!-- Volume Label (Outputs the Result, resting directly in the upper center) -->
            <text id="svgVolumeText" x="150" y="80" fill="#ffcc00" font-size="22" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Volume</text>
        </svg>
    `;
    mainWrapper.append(visualContainer);
}

function whenLoaded()
{
    makeInterface();
}

</script>
</head>
<body onload='whenLoaded();'>
</body>
</html>
