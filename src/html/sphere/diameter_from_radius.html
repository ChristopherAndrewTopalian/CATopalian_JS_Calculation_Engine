<!DOCTYPE html>
<html lang='en'>
<head>
<title> Sphere: Diameter from Radius </title>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<link rel="stylesheet" href="../../../src/css/style001.css">

<script src='../../../src/js/1shortcuts/shortcuts.js'></script>
<script src='../../../src/js/sound/sound.js'></script>

<script>

function calculateSphereDiameterFromRadius(radius)
{
    try
    {
        // Diameter is exactly twice the radius
        let r = parseFloat(radius);
        let diameter = r * 2;
        
        return diameter.toFixed(3);
    }
    catch (error)
    {
        console.log("Error: Could not convert input to a number.");
        return null;
    }
}

function makeInterface()
{
    let theTitle = ce('div');
    theTitle.id = 'theTitle';
    theTitle.textContent = 'Sphere: Diameter from Radius';
    ba(theTitle);

    let mainWrapper = ce('div');
    mainWrapper.style.display = 'flex';
    mainWrapper.style.flexDirection = 'row';
    mainWrapper.style.gap = '40px';
    mainWrapper.style.alignItems = 'center';
    ba(mainWrapper);

    // ===
    // LEFT SIDE: The Calculator
    // ===
    let inputContainer = ce('div');
    inputContainer.id = 'inputContainer';
    mainWrapper.append(inputContainer);

    let input_A_Label = ce('div');
    input_A_Label.id = 'input_A_Label';
    input_A_Label.textContent = 'RADIUS';
    inputContainer.append(input_A_Label);

    let inputA = ce('input');
    inputA.id = 'inputA';
    inputA.type = 'number';
    inputA.oninput = function()
    {
        if(typeof inputSound === "function") inputSound();
        
        let result = calculateSphereDiameterFromRadius(inputA.value);
        ge('result').value = result;
        
        // Update both SVG labels dynamically
        if (inputA.value === '')
        {
            ge('svgRadiusText').textContent = 'Radius';
            ge('svgDiameterText').textContent = 'Diameter';
        }
        else
        {
            ge('svgRadiusText').textContent = 'R = ' + inputA.value;
            ge('svgDiameterText').textContent = 'D = ' + result; 
        }
    };
    inputContainer.append(inputA);

    //-//

    let result_label = ce('div');
    result_label.id = 'result_label';
    result_label.textContent = 'Diameter';
    inputContainer.append(result_label);

    let result = ce('textarea');
    result.id = 'result';
    result.readOnly = true; 
    inputContainer.append(result);

    // ===
    // RIGHT SIDE: The SVG Graphic
    // ===
    let visualContainer = ce('div');
    visualContainer.id = 'visualContainer';
    
    visualContainer.innerHTML = `
        <svg width="300" height="250" viewBox="0 0 300 250">
            <defs>
                <!-- 3D Radial Gradient Lighting for the neutral shell -->
                <radialGradient id="sphereLight" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="rgba(0, 255, 255, 0.4)" />
                    <stop offset="100%" stop-color="rgba(0, 136, 255, 0.1)" />
                </radialGradient>
            </defs>

            <!-- The Sphere Base -->
            <circle cx="150" cy="125" r="100" fill="url(#sphereLight)" stroke="#00ffcc" stroke-width="2" />
            
            <!-- A subtle dotted equator to maintain the 3D core illusion -->
            <path d="M 50,125 A 100,30 0 0,0 250,125" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.6" />
            <path d="M 50,125 A 100,30 0 0,1 250,125" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.3" />

            <!-- Solid Diameter Line (Output: Piercing horizontally from edge to edge) -->
            <line x1="50" y1="125" x2="250" y2="125" stroke="#ffcc00" stroke-width="5" />
            
            <!-- Diameter Label (Outputs the Result, resting slightly above the yellow line) -->
            <text id="svgDiameterText" x="150" y="115" fill="#ffcc00" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Diameter</text>

            <!-- Dashed Radius Line (Input: Extending diagonally from the core to the top right) -->
            <!-- We angle this so it doesn't overlap and hide the horizontal diameter! -->
            <line x1="150" y1="125" x2="220" y2="55" stroke="#00ffcc" stroke-width="3" stroke-dasharray="5,5" />
            
            <!-- Radius Label (Inputs the Value, resting near the diagonal cyan line) -->
            <text id="svgRadiusText" x="210" y="70" fill="#00ffcc" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Radius</text>

            <!-- Center Core Dot (Cyan to match the base geometry) -->
            <circle cx="150" cy="125" r="5" fill="#00ffcc" />
        </svg>
    `;
    mainWrapper.append(visualContainer);
}

function whenLoaded()
{
    makeInterface();
}

</script>
</head>
<body onload='whenLoaded();'>
</body>
</html>
