<!DOCTYPE html>
<html lang='en'>
<head>
<title> Sphere: Circumference from Volume </title>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<link rel="stylesheet" href="../../../src/css/style001.css">

<script src='../../../src/js/1shortcuts/shortcuts.js'></script>
<script src='../../../src/js/sound/sound.js'></script>

<script>

function calculateSphereCircumferenceFromVolume(volume)
{
    try
    {
        // Extract the radius from the volume.
        // Formula: r = cbrt( (V * 0.75) / pi )
        let v = parseFloat(volume);
        let radius = Math.cbrt((v * 0.75) / Math.PI);
        
        // Calculate the Circumference
        // Formula: C = 2 * pi * r
        let circumference = 2 * Math.PI * radius;
        
        return circumference.toFixed(3);
    }
    catch (error)
    {
        console.log("Error: Could not convert input to a number.");
        return null;
    }
}

function makeInterface()
{
    let theTitle = ce('div');
    theTitle.id = 'theTitle';
    theTitle.textContent = 'Sphere: Circumference from Volume';
    ba(theTitle);

    let mainWrapper = ce('div');
    mainWrapper.style.display = 'flex';
    mainWrapper.style.flexDirection = 'row';
    mainWrapper.style.gap = '40px';
    mainWrapper.style.alignItems = 'center';
    ba(mainWrapper);

    // ===
    // LEFT SIDE: The Calculator
    // ===
    let inputContainer = ce('div');
    inputContainer.id = 'inputContainer';
    mainWrapper.append(inputContainer);

    let input_A_Label = ce('div');
    input_A_Label.id = 'input_A_Label';
    input_A_Label.textContent = 'VOLUME';
    inputContainer.append(input_A_Label);

    let inputA = ce('input');
    inputA.id = 'inputA';
    inputA.type = 'number';
    inputA.oninput = function()
    {
        if(typeof inputSound === "function") inputSound();
        
        let result = calculateSphereCircumferenceFromVolume(inputA.value);
        ge('result').value = result;
        
        // Update both SVG labels dynamically
        if (inputA.value === '')
        {
            ge('svgVolumeText').textContent = 'Volume';
            ge('svgCircumferenceText').textContent = 'Circumference';
        }
        else
        {
            ge('svgVolumeText').textContent = 'V = ' + inputA.value;
            ge('svgCircumferenceText').textContent = 'C = ' + result; 
        }
    };
    inputContainer.append(inputA);

    //-//

    let result_label = ce('div');
    result_label.id = 'result_label';
    result_label.textContent = 'Circumference';
    inputContainer.append(result_label);

    let result = ce('textarea');
    result.id = 'result';
    result.readOnly = true; 
    inputContainer.append(result);

    // ===
    // RIGHT SIDE: The SVG Graphic
    // ===
    let visualContainer = ce('div');
    visualContainer.id = 'visualContainer';
    
    visualContainer.innerHTML = `
        <svg width="300" height="250" viewBox="0 0 300 250">
            <defs>
                <!-- 3D Radial Gradient Lighting -->
                <!-- Glowing yellow/orange represents the solid "filled" Volume (Input) -->
                <radialGradient id="sphereLight" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="rgba(255, 255, 0, 0.8)" />
                    <stop offset="100%" stop-color="rgba(255, 136, 0, 0.4)" />
                </radialGradient>
                
                <!-- Invisible curved path for the Circumference (Front Equator) -->
                <path id="equatorCurve" d="M 50,125 A 100,30 0 0,0 250,125" fill="none" />
            </defs>

            <!-- The Sphere Base (Input: Volume) -->
            <!-- Solid glowing fill, no thick outer stroke so the interior stands out -->
            <circle cx="150" cy="125" r="100" fill="url(#sphereLight)" stroke="#ffcc00" stroke-width="1.5" />
            
            <!-- BACK half of the equator (Dotted, fading behind the sphere) -->
            <path d="M 50,125 A 100,30 0 0,1 250,125" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
            
            <!-- FRONT half of the equator (Output: Circumference) -->
            <!-- Drawn as a thick, solid cyan line wrapped around the middle -->
            <path d="M 50,125 A 100,30 0 0,0 250,125" fill="none" stroke="#00ffcc" stroke-width="4" />

            <!-- Center Core Dot -->
            <circle cx="150" cy="125" r="4" fill="#00ffcc" />

            <!-- Volume Label (Inputs the Value, resting directly in the center of the mass) -->
            <text id="svgVolumeText" x="150" y="100" fill="#ffcc00" font-size="22" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">Volume</text>
            
            <!-- Circumference Label (Outputs the Result, wrapping exactly around the 3D equator path) -->
            <text fill="#00ffcc" font-size="20" font-weight="bold" font-family="Arial, sans-serif" dy="5" style="text-shadow: 1px 1px 4px black, -1px -1px 4px black;">
                <textPath id="svgCircumferenceText" href="#equatorCurve" startOffset="50%" text-anchor="middle">Circumference</textPath>
            </text>
        </svg>
    `;
    mainWrapper.append(visualContainer);
}

function whenLoaded()
{
    makeInterface();
}

</script>
</head>
<body onload='whenLoaded();'>
</body>
</html>
